spring.application.name=neobank-backend

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# En local : utilise localhost et "hhhhhhhh"
# Sur Render : utilise les variables d'environnement
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/neobank_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hhhhhhhh}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:neobankSuperSecretKey2026WithAtLeast32CharactersLong}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# SERVER (obligatoire pour Render)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# LOGGING
# ==========================================
logging.level.com.neobank=${LOG_LEVEL:DEBUG}